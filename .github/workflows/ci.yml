name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # Must run before typecheck: @zodem/core's package.json resolves its
      # types from dist/, so packages that depend on it (proto, codec, cli)
      # can't type-check against a workspace sibling that hasn't been built.
      - run: pnpm run build

      # pnpm links workspace `bin` entries (e.g. `zodem`, resolved from
      # packages/cli's package.json to dist/index.js) at install time. On a
      # fresh checkout dist/ doesn't exist yet, so that first install skips
      # the symlink — reinstalling now that build has produced dist/ creates
      # it, which example:generate:check below depends on.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # tsconfig.test.json exists because every package's own tsconfig is
      # scoped to "src" (rootDir requires it) and so never covers test/ —
      # this is the only thing that actually type-checks the test suites.
      - run: pnpm run typecheck:tests

      - run: pnpm run test

      # Fails the build if the schemas changed but proto/ or the lockfile
      # weren't regenerated and committed — this is the guarantee the whole
      # project sells, so CI is where it's actually enforced.
      - run: pnpm run example:generate:check

      - run: pnpm run example:buf:lint

      # Optional extra check (TODO.md Phase 3): reports wire-breaking drift
      # against main without blocking the merge. Only meaningful on a PR —
      # on a push to main, origin/main is the commit itself.
      - name: buf breaking (optional)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch origin main
          pnpm run example:buf:breaking
