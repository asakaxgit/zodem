name: Release

on:
  push:
    branches: [main]

# contents/pull-requests: changesets/action opens and updates its own
# "Version Packages" PR using the default GITHUB_TOKEN — no PAT needed.
# id-token: the OIDC identity this workflow presents to npm's trusted
# publishing. There is no NPM_TOKEN/NODE_AUTH_TOKEN anywhere in this file —
# that's the point. See RELEASING.md for the one-time npm-side setup this
# depends on (an npm Trusted Publisher configured for this exact repo and
# workflow filename).
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v11+, not this repo's daily-driver 10.34.5 (see "packageManager" in
      # package.json, used by ci.yml and everywhere else): pnpm's npm-OIDC
      # "trusted publishing" support for `pnpm publish` was introduced as
      # part of pnpm 11's from-scratch publish reimplementation and never
      # backported to the 10.x line — pnpm 10 has no code path to attempt
      # the OIDC exchange at all, so id-token: write above is silently
      # inert under it (confirmed: id-token: write plus pnpm 10 still fails
      # with a plain ENEEDAUTH, not an OIDC-specific error). This input
      # overrides the "packageManager" field for this one workflow only —
      # pnpm/action-setup's `version` always takes precedence over it when
      # both are present, confirmed against the action's own docs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This action's own logic decides which of the two commands below
      # actually runs:
      # - pending changesets in .changeset/ -> runs `version`, opening/
      #   updating the "Version Packages" PR. Nothing is built or published.
      # - no pending changesets (that PR was just merged) -> runs `publish`,
      #   which builds fresh and publishes every package whose version
      #   changed. `pnpm publish` rewrites each `workspace:*` internal
      #   dependency to a real version as part of that (pnpm's own publish
      #   behavior, independent of this action).
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
